# /etc/systemd/system/webhook.service.d/override.conf
# Prepare the non-login user, root:developed-webhook 0640 /etc/webhook.conf,
# private state directory and owned marketing root before installing this file.
[Unit]
After=network-online.target tailscaled.service
Wants=network-online.target
Requires=developed-uid-boundary.service
After=developed-uid-boundary.service

[Service]
User=developed-webhook
Group=developed-webhook
SupplementaryGroups=
ExecStart=
ExecStart=/usr/bin/webhook -nopanic -ip 127.0.0.1 -port 9000 -http-methods POST -hooks /etc/webhook.conf
WorkingDirectory=/var/lib/developed-webhook
StateDirectory=developed-webhook
StateDirectoryMode=0700
UMask=0077
NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ReadWritePaths=/var/www/developed.sk
# Read-only mounts do not block Unix sockets. Mask control endpoints explicitly.
InaccessiblePaths=/run/tailscale -/run/docker.sock -/run/dbus -/run/systemd/private -/run/mega-youtube-front -/run/karak2 /etc/developed-accounts /etc/developed-apps /var/backups
MemoryMax=512M
TasksMax=64
LimitNOFILE=512
Restart=on-failure
RestartSec=5s
