# Add to each tunnel's service drop-ins; its own unit sets a dedicated user and
# LoadCredential paths. Tunnel tokens must never appear in ExecStart or env.
[Unit]
After=tailscaled.service

[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
InaccessiblePaths=/run/tailscale -/run/docker.sock -/run/dbus -/run/systemd/private /etc/developed-accounts /etc/developed-apps /var/backups
UMask=0077
MemoryMax=256M
TasksMax=64
TimeoutStartSec=90s
