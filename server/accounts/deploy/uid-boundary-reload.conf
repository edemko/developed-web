# /etc/systemd/system/developed-uid-boundary.service.d/reload.conf
# Use `systemctl reload developed-uid-boundary`, never restart: runtime units
# require this service, so restarting it also restarts dependent applications.
[Service]
ExecReload=/usr/bin/flock --nonblock /run/developed-uid-boundary/loader.lock /opt/developed-runtimes/node-v24.21.0/bin/node /opt/developed-control/network-music-e307109/load-uid-boundary.mjs --apply
